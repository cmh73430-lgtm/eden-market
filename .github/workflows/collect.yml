# 평일 아침(07:05·08:05 KST)에 미국 지표·미국 대응주·코스피200 야간선물, 오후(16:20 KST)에 코스피·코스닥 마감·수급을 모아
# 이 저장소 main 브랜치의 auto/<날짜>.json 에 저장한다. Eden Cockpit 앱이 열쇠 없이 raw.githubusercontent.com 으로 읽는다.
# 주말·휴장일(data/holidays.json)은 스스로 건너뛴다. cron 은 UTC (KST -9시간). GitHub 예약 실행은 5~20분 늦을 수 있다.
name: collect
on:
  schedule:
    - cron: "35 21 * * 0-4"   # 06:35 KST 월~금 (GitHub 예약은 10~20분 늦게 시작돼서 7시 전후에 받도록 한 번 더)
    - cron: "5 22 * * 0-4"   # 07:05 KST 월~금
    - cron: "5 23 * * 0-4"   # 08:05 KST 월~금
    - cron: "25 0 * * 1-5"   # 09:25 KST 월~금 장중 재판정 (외인 선물·현물 수급 · 늦으면 9:40쯤)
    - cron: "25 1 * * 1-5"   # 10:25 KST 월~금 장중 재판정
    - cron: "*/5 0-6 * * 1-5" # 09:00~15:40 KST 5분마다 — 장중 실시간 주도 테마 (--when=live → auto/live.json 만, 09:05~15:40 밖이면 스크립트가 건너뜀)
    - cron: "20 7 * * 1-5"   # 16:20 KST 월~금
    - cron: "45 10 * * 1-5"  # 19:45 KST 월~금 (종목별 외국인·기관 수급이 네이버에 올라온 뒤 주도 테마 확정 — 18:53 에는 아직 없었고 20:19 에 있었음, 2026-09-30 확인)
    - cron: "20 11 * * 1-5"  # 20:20 KST 월~금 (19:45 에도 수급이 비었을 때 대비한 한 번 더)
  workflow_dispatch:
    inputs:
      when:
        description: "morning(아침) · intraday(장중) · close(오후) · themes(미국장 테마만 아침 기록에 보충) · live(장중 실시간 주도 테마 → live.json) — 비우면 지금 시각으로"
        required: false
        default: ""
      force:
        description: "주말·휴장일에도 실행 (true)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 수집해서 main 브랜치 auto/ 에 저장
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_BRANCH: main
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.when }}" ]; then ARGS="$ARGS --when=${{ github.event.inputs.when }}"; fi
          if [ "${{ github.event.schedule }}" = "*/20 0-6 * * 1-5" ]; then ARGS="$ARGS --when=live"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node --disable-warning=ExperimentalWarning scripts/collect-auto.mjs $ARGS
