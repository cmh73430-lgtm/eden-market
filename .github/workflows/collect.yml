# 평일 아침(07:05·08:05 KST)에 미국 지표·미국 대응주·코스피200 야간선물, 오후(16:20 KST)에 코스피·코스닥 마감·수급을 모아
# 이 저장소 main 브랜치의 auto/<날짜>.json 에 저장한다. Eden Cockpit 앱이 열쇠 없이 raw.githubusercontent.com 으로 읽는다.
# 주말·휴장일(data/holidays.json)은 스스로 건너뛴다. cron 은 UTC (KST -9시간). GitHub 예약 실행은 늦을 수 있다(10/28~ 실측 3~10시간 · 9.29-158 칸 고정).
# 9.29-158: 아래 cron 글자를 바꾸면 server/slot.js SLOTS 도 같이 바꿀 것(test/cockpit158 이 대조 · 표에 없는 칸은 건너뜀)
name: collect
on:
  schedule:
    - cron: "35 21 * * 0-4"   # 06:35 KST 월~금 (GitHub 예약은 10~20분 늦게 시작돼서 7시 전후에 받도록 한 번 더)
    - cron: "5 22 * * 0-4"   # 07:05 KST 월~금
    - cron: "5 23 * * 0-4"   # 08:05 KST 월~금
    - cron: "32 0 * * 1-5"   # 09:32 KST 월~금 장중 run 1회 (날짜 파일 intraday · 아침 브리핑 ② 공시 한 번 더) — 9.29-109 원장 [2298]: 재판정 5분마다는 아래 live(5분) 실행 안에서 같이 받음 · 30분 예약(10:02~14:32) 정리
    - cron: "*/5 0-6 * * 1-5" # 09:00~15:40 KST 5분마다 — 장중 실시간 주도 테마 (--when=live → auto/live.json 만, 09:05~15:40 밖이면 스크립트가 건너뜀)
    - cron: "0 7 * * 1-5"    # 16:00 KST 월~금 「오후 4시 기준」 묶음 (--when=close1600 · 미국 선물 4종·코스피200 선물·환율·WTI·비트코인 → 날짜 파일 장마감_1600 · 9.29-87 원장 [1666])
    - cron: "20 7 * * 1-5"   # 16:20 KST 월~금
    - cron: "45 10 * * 1-5"  # 19:45 KST 월~금 (종목별 외국인·기관 수급이 네이버에 올라온 뒤 주도 테마 확정 — 18:53 에는 아직 없었고 20:19 에 있었음, 2026-09-30 확인)
    - cron: "20 11 * * 1-5"  # 20:20 KST 월~금 (19:45 에도 수급이 비었을 때 대비한 한 번 더)
  workflow_dispatch:
    inputs:
      when:
        description: "morning(아침) · intraday(장중) · close(오후) · themes(미국장 테마만 아침 기록에 보충) · live(장중 실시간 주도 테마 → live.json) · afterlive(16:00~20:05 애프터 실시간 → live-after.json) — 비우면 지금 시각으로"
        required: false
        default: ""
      force:
        description: "주말·휴장일에도 실행 (true)"
        required: false
        default: ""
      cron:
        description: "9.29-158 예약 칸 대신 깨우기(집 PC·중계 서버)가 칸 글자(예 \"20 11 * * 1-5\")를 주면 그 칸으로 종류·날짜 고정 — 비우면 when · 둘 다 주면 when 이 종류"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 수집해서 main 브랜치 auto/ 에 저장
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_BRANCH: main
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}       # 9.29-111 키움 장중 수급(Secrets 비면 키움 길 건너뜀 · 토큰은 ::add-mask::)
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          IN_WHEN: ${{ github.event.inputs.when }}
          IN_FORCE: ${{ github.event.inputs.force }}
          SCHED: ${{ github.event.schedule || github.event.inputs.cron }}   # 9.29-158 원장 [집2664] 예약 칸(cron 글자 · 수동 실행이면 cron 입력 · 없으면 빈 값)
        # 9.29-158: 예약 실행은 칸(--cron=)을 넘기고 수집기(server/slot.js SLOTS)가 칸으로 종류·날짜를 고정한다 — 늦게 돌아도 그 칸의 거래일 · 허용 창 밖이면 저장 안 함
        #   (예전: 「지금 시각」으로 정해 20:20 칸이 새벽에 아침으로 · 16:00 칸이 자정 넘어 다음 날 장마감_1600 으로 저장됨) · 수동(workflow_dispatch)은 when 입력 → 없으면 지금 시각
        run: |
          ARGS=()
          if [ -n "$IN_WHEN" ]; then ARGS+=("--when=$IN_WHEN"); fi
          if [ -n "$SCHED" ]; then ARGS+=("--cron=$SCHED"); fi
          if [ "$IN_FORCE" = "true" ]; then ARGS+=("--force"); fi
          node --disable-warning=ExperimentalWarning scripts/collect-auto.mjs "${ARGS[@]}"
